<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#E5F1F9"/><rect x="39" y="40" width="1002" height="1270" rx="26" fill="#FAFCFE"/><rect x="39" y="40" width="1002" height="1270" rx="26" fill="none" stroke="#C7DDEB" stroke-width="3"/><text x="91" y="127" font-family="Liberation Serif" font-size="54" font-weight="600" fill="#263E58" text-anchor="start">Das wird gefragt.</text><text x="94" y="168" font-family="Inter" font-size="18" font-weight="600" fill="#667C90" text-anchor="start">HEILPRAKTIKERWISSEN MIT DURCHBLICK</text><text x="980" y="120" font-family="Inter" font-size="25" font-weight="700" fill="#AF5979" text-anchor="end">1/3</text><path d="M91 199H989" stroke="#CDDFEC" stroke-width="3"/><text x="100" y="284" font-family="Inter" font-size="29" font-weight="700" fill="#AF5979" text-anchor="start">PRÜFUNGSFRAGE</text><text x="100" y="367" font-family="Inter" font-size="66" font-weight="600" fill="#263E58" text-anchor="start">Ein Bein wird plötzlich</text><text x="100" y="455" font-family="Inter" font-size="66" font-weight="600" fill="#263E58" text-anchor="start">blass, kalt und</text><text x="100" y="543" font-family="Inter" font-size="66" font-weight="600" fill="#263E58" text-anchor="start">sehr schmerzhaft.</text><text x="100" y="718" font-family="Inter" font-size="42" font-weight="600" fill="#263E58" text-anchor="start">Woran denkst du zuerst?</text><rect x="97" y="767" width="885" height="100" rx="17" fill="#F0F7FB" stroke="#C7DDEB" stroke-width="2"/><circle cx="148" cy="817" r="30" fill="#E3C4D0"/><text x="148" y="827" font-family="Inter" font-size="30" font-weight="700" fill="#263E58" text-anchor="middle">A</text><text x="205" y="829" font-family="Inter" font-size="35" font-weight="500" fill="#263E58" text-anchor="start">Erysipel</text><rect x="97" y="885" width="885" height="100" rx="17" fill="#F0F7FB" stroke="#C7DDEB" stroke-width="2"/><circle cx="148" cy="935" r="30" fill="#E3C4D0"/><text x="148" y="945" font-family="Inter" font-size="30" font-weight="700" fill="#263E58" text-anchor="middle">B</text><text x="205" y="947" font-family="Inter" font-size="35" font-weight="500" fill="#263E58" text-anchor="start">Tiefe Venenthrombose</text><rect x="97" y="1003" width="885" height="100" rx="17" fill="#F0F7FB" stroke="#C7DDEB" stroke-width="2"/><circle cx="148" cy="1053" r="30" fill="#E3C4D0"/><text x="148" y="1063" font-family="Inter" font-size="30" font-weight="700" fill="#263E58" text-anchor="middle">C</text><text x="205" y="1065" font-family="Inter" font-size="35" font-weight="500" fill="#263E58" text-anchor="start">Akuter arterieller Verschluss</text><text x="110" y="1174" font-family="Inter" font-size="31" font-weight="700" fill="#AF5979" text-anchor="start">Die Auflösung folgt  →</text><path d="M91 1227H989" stroke="#CDDFEC" stroke-width="3"/><text x="540" y="1278" font-family="Inter" font-size="19" font-weight="600" fill="#667C90" text-anchor="middle">SCHRIFTLICHE HEILPRAKTIKERPRÜFUNG</text></svg>