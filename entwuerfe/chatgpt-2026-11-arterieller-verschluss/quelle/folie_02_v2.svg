<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="bgv2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C5D9F2"/><stop offset="1" stop-color="#E3EDF9"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bgv2)"/><rect x="39" y="40" width="1002" height="1270" rx="26" fill="#FAFCFE"/><rect x="39" y="40" width="1002" height="1270" rx="26" fill="none" stroke="#AFC9E6" stroke-width="3"/><text x="91" y="127" font-family="Liberation Serif" font-size="54" font-weight="600" fill="#263E58" text-anchor="start">Das wird gefragt.</text><text x="94" y="168" font-family="Inter" font-size="22" font-weight="600" fill="#5D6E80" text-anchor="start">HEILPRAKTIKERWISSEN MIT DURCHBLICK</text><text x="980" y="120" font-family="Inter" font-size="25" font-weight="700" fill="#AF5979" text-anchor="end">2/3</text><path d="M91 199H989" stroke="#CDDFEC" stroke-width="3"/><text x="100" y="284" font-family="Inter" font-size="29" font-weight="700" fill="#AF5979" text-anchor="start">AUFLÖSUNG</text><text x="100" y="380" font-family="Inter" font-size="62" font-weight="600" fill="#263E58" text-anchor="start">C – Akuter arterieller</text><text x="100" y="464" font-family="Inter" font-size="62" font-weight="600" fill="#263E58" text-anchor="start">Gefäßverschluss</text><rect x="98" y="512" width="885" height="214" rx="23" fill="#F1DEE6"/><text x="128" y="562" font-family="Inter" font-size="34" font-weight="800" fill="#263E58">ZEITKRITISCHER NOTFALL: Notruf 112</text><text x="128" y="612" font-family="Inter" font-size="30" font-weight="500" fill="#263E58">Bein tief lagern und weich polstern,</text><text x="128" y="654" font-family="Inter" font-size="30" font-weight="500" fill="#263E58">nicht laufen lassen,</text><text x="128" y="696" font-family="Inter" font-size="30" font-weight="500" fill="#263E58">weder wärmen noch kühlen.</text><text x="100" y="800" font-family="Inter" font-size="41" font-weight="600" fill="#263E58" text-anchor="start">Typische Warnzeichen</text><text x="120" y="868" font-family="Inter" font-size="37" font-weight="400" fill="#263E58" text-anchor="start">• Plötzliche starke Schmerzen</text><text x="120" y="932" font-family="Inter" font-size="37" font-weight="400" fill="#263E58" text-anchor="start">• Blasse, kalte Extremität</text><text x="120" y="996" font-family="Inter" font-size="37" font-weight="400" fill="#263E58" text-anchor="start">• Fehlender oder schwacher Puls</text><text x="120" y="1060" font-family="Inter" font-size="37" font-weight="400" fill="#263E58" text-anchor="start">• Gefühlsstörung oder Lähmung</text><text x="100" y="1175" font-family="Inter" font-size="31" font-weight="700" fill="#AF5979" text-anchor="start">Warum diese Zeichen?  →</text><path d="M91 1227H989" stroke="#CDDFEC" stroke-width="3"/><text x="540" y="1278" font-family="Inter" font-size="22" font-weight="600" fill="#5D6E80" text-anchor="middle">SCHRIFTLICHE HEILPRAKTIKERPRÜFUNG</text></svg>