<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="bgv2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C5D9F2"/><stop offset="1" stop-color="#E3EDF9"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bgv2)"/><rect x="39" y="40" width="1002" height="1270" rx="26" fill="#FAFCFE"/><rect x="39" y="40" width="1002" height="1270" rx="26" fill="none" stroke="#AFC9E6" stroke-width="3"/><text x="91" y="127" font-family="Liberation Serif" font-size="54" font-weight="600" fill="#263E58" text-anchor="start">Das wird gefragt.</text><text x="94" y="168" font-family="Inter" font-size="22" font-weight="600" fill="#5D6E80" text-anchor="start">HEILPRAKTIKERWISSEN MIT DURCHBLICK</text><text x="980" y="120" font-family="Inter" font-size="25" font-weight="700" fill="#AF5979" text-anchor="end">3/3</text><path d="M91 199H989" stroke="#CDDFEC" stroke-width="3"/><text x="100" y="284" font-family="Inter" font-size="27" font-weight="700" fill="#AF5979" text-anchor="start">MEDIZIN MIT DURCHBLICK</text><text x="100" y="381" font-family="Inter" font-size="61" font-weight="600" fill="#263E58" text-anchor="start">Warum wird das Bein</text><text x="100" y="463" font-family="Inter" font-size="61" font-weight="600" fill="#263E58" text-anchor="start">blass und kalt?</text><rect x="98" y="520" width="884" height="300" rx="25" fill="#EEF4FB" stroke="#C3D6EA" stroke-width="2"/><text x="140" y="580" font-family="Inter" font-size="26" font-weight="600" fill="#5D6E80">Blutfluss</text><path d="M262 572h70m-14-12 14 12-14 12" fill="none" stroke="#5D6E80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 660H520" stroke="#B5455F" stroke-width="46" stroke-linecap="round"/><path d="M540 660H930" stroke="#E7D3DA" stroke-width="46" stroke-linecap="round"/><circle cx="530" cy="660" r="34" fill="#6E2A42" stroke="#FDFDFD" stroke-width="5"/><text x="530" y="735" font-family="Inter" font-size="30" font-weight="700" fill="#263E58" text-anchor="middle">Verschluss</text><text x="300" y="735" font-family="Inter" font-size="26" font-weight="500" fill="#5D6E80" text-anchor="middle">davor: durchblutet</text><text x="760" y="735" font-family="Inter" font-size="26" font-weight="500" fill="#5D6E80" text-anchor="middle">dahinter: kaum Blut</text><text x="760" y="775" font-family="Inter" font-size="26" font-weight="500" fill="#5D6E80" text-anchor="middle">→ blass, kalt, Schmerz</text><text x="100" y="895" font-family="Inter" font-size="36" font-weight="500" fill="#263E58">Weniger Blut heißt weniger Sauerstoff und</text><text x="100" y="943" font-family="Inter" font-size="36" font-weight="500" fill="#263E58">weniger Wärme. Hält der Verschluss an,</text><text x="100" y="991" font-family="Inter" font-size="36" font-weight="500" fill="#263E58">wird die Haut fleckig-bläulich.</text><text x="100" y="1060" font-family="Inter" font-size="30" font-weight="500" fill="#5D6E80">Zum Vergleich – Venenthrombose: Blut fließt hinein,</text><text x="100" y="1098" font-family="Inter" font-size="30" font-weight="500" fill="#5D6E80">aber nicht ab; das Bein schwillt an, kann bläulich werden.</text><rect x="97" y="1130" width="888" height="74" rx="16" fill="#F1DEE6"/><text x="127" y="1179" font-family="Inter" font-size="29" font-weight="700" fill="#263E58">Merke: Plötzlich blass + kalt + Schmerz → Notruf 112</text><path d="M91 1227H989" stroke="#CDDFEC" stroke-width="3"/><text x="540" y="1278" font-family="Inter" font-size="22" font-weight="600" fill="#5D6E80" text-anchor="middle">SCHRIFTLICHE HEILPRAKTIKERPRÜFUNG</text></svg>