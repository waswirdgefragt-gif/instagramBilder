<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
<title id="title">Eingeatmete Fremdkörper: Warum landen sie meist in der rechten Lunge?</title>
<desc id="description">Anatomische Vorderansicht mit beiden Lungen, drei rechten und zwei linken Lappen, Luftröhre, Haupt- und Lappenbronchien sowie Fremdkörperweg in den rechten Hauptbronchus.</desc>
<defs>
