<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  :root { --blau1:#C5D9F2; --blau2:#E3EDF9; --navy:#2F3E58; --rose:#A9466A; --grau:#5D6473; }
  html,body { margin:0; width:1080px; height:1350px; overflow:hidden; }
  body { background:linear-gradient(180deg,var(--blau1),var(--blau2)); font-family:"Inter",sans-serif; color:var(--navy); position:relative; }
  .kopf { position:absolute; top:58px; left:90px; right:90px; display:flex; justify-content:space-between; align-items:center; }
  .marke { display:flex; gap:14px; align-items:center; font:700 31px "Liberation Serif",serif; }
  .seite { font:600 24px "Inter"; background:#fff; border-radius:99px; padding:6px 18px; }
  .inhalt { position:absolute; top:250px; left:90px; right:90px; }
  .pill { display:inline-block; background:var(--rose); color:#fff; font:800 26px "Inter"; letter-spacing:.14em; padding:10px 22px; border-radius:99px; margin-bottom:44px; }
  h1 { font:900 112px/1.02 "Inter Display","Inter",sans-serif; margin:0; letter-spacing:-2px; }
  h1 .r { color:var(--rose); }
  .frage { font:400 44px/1.32 "Inter"; margin:56px 0 0; max-width:860px; }
  .frage b { font-weight:700; }
  .wisch { position:absolute; left:90px; top:1050px; background:#fff; border-radius:16px; padding:18px 30px; font:700 32px "Inter"; box-shadow:0 6px 18px rgba(47,62,88,.12); }
  .fuss { position:absolute; bottom:56px; left:90px; font:500 24px "Inter"; color:var(--grau); }
</style></head><body>
  <div class="kopf"><div class="marke"><svg width="44" height="44" viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="7" fill="#fff"/><rect x="8" y="9" width="8" height="8" rx="1.6" fill="none" stroke="#3B4B66" stroke-width="1.6"/><path d="M7 8l10.5 10.5M17.5 7.5L7.5 17.5" stroke="#A9466A" stroke-width="2.4" stroke-linecap="round"/><rect x="20" y="12" width="13" height="2.2" rx="1.1" fill="#C6CDD8"/><rect x="8" y="23" width="8" height="8" rx="1.6" fill="none" stroke="#3B4B66" stroke-width="1.6"/><rect x="20" y="26" width="13" height="2.2" rx="1.1" fill="#C6CDD8"/></svg>Das wird gefragt.</div><span class="seite">1/3</span></div>
  <div class="inhalt">
    <div class="pill">GENAU UNTERSCHEIDEN</div>
    <h1>Luft ohne Blut.<br><span class="r">Blut ohne Luft.</span></h1>
    <p class="frage">Beide rauben dem Blut Sauerstoff – aber an ganz verschiedenen Stellen: <b>Lungenembolie oder Lungenödem?</b></p>
  </div>
  <div class="wisch">Wischen →</div>
  <div class="fuss">Schriftliche Heilpraktikerprüfung</div>
</body></html>
