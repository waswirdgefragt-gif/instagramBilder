<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C5D9F2"/><stop offset="1" stop-color="#E3EDF9"/></linearGradient>
    <pattern id="wasser" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#9FC3E8"/><circle cx="6" cy="7" r="2.4" fill="#fff" opacity=".7"/><circle cx="16" cy="15" r="1.8" fill="#fff" opacity=".6"/></pattern>
  </defs>
  <style>
    .t { font-family: Inter, sans-serif; fill: #2F3E58; }
    .h { font-family: "Liberation Serif", serif; font-weight: 700; fill: #2F3E58; }
    .klein { font-family: Inter, sans-serif; fill: #5D6473; }
  </style>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <text x="90" y="100" class="h" font-size="31">Das wird gefragt.</text>
  <rect x="902" y="70" width="88" height="44" rx="22" fill="#fff"/><text x="946" y="101" class="t" font-size="24" font-weight="600" text-anchor="middle">2/3</text>
  <text x="90" y="215" class="h" font-size="58">Wo hakt der Gasaustausch?</text>

  <!-- linke Karte: Lungenembolie -->
  <rect x="90" y="270" width="430" height="880" rx="28" fill="#fff"/>
  <text x="305" y="340" class="t" font-size="40" font-weight="800" text-anchor="middle">Lungenembolie</text>
  <!-- Lungenbläschen mit Luft -->
  <circle cx="305" cy="540" r="120" fill="#F3F7FC" stroke="#2F3E58" stroke-width="5"/>
  <path d="M245 520 q30 -30 60 0 t60 0" fill="none" stroke="#7FA6D6" stroke-width="6" stroke-linecap="round"/>
  <path d="M245 565 q30 -30 60 0 t60 0" fill="none" stroke="#7FA6D6" stroke-width="6" stroke-linecap="round"/>
  <text x="305" y="400" class="klein" font-size="24" text-anchor="middle">Luft kommt an</text>
  <!-- Kapillare mit Gerinnsel -->
  <rect x="140" y="700" width="330" height="56" rx="28" fill="#E8B9C8"/>
  <rect x="140" y="700" width="140" height="56" rx="28" fill="#C76B8A"/>
  <ellipse cx="282" cy="728" rx="40" ry="34" fill="#7A2E48"/>
  <text x="305" y="800" class="klein" font-size="24" text-anchor="middle">Ein Gerinnsel verschließt</text>
  <text x="305" y="832" class="klein" font-size="24" text-anchor="middle">einen Ast der Lungenarterie</text>
  <text x="305" y="935" class="t" font-size="34" font-weight="800" text-anchor="middle" fill="#A9466A">Belüftet,</text>
  <text x="305" y="980" class="t" font-size="34" font-weight="800" text-anchor="middle" fill="#A9466A">aber kaum durchblutet</text>
  <text x="305" y="1050" class="klein" font-size="24" text-anchor="middle">Gerinnsel meist aus den</text>
  <text x="305" y="1082" class="klein" font-size="24" text-anchor="middle">tiefen Bein- oder Beckenvenen</text>

  <!-- rechte Karte: Lungenödem -->
  <rect x="560" y="270" width="430" height="880" rx="28" fill="#fff"/>
  <text x="775" y="340" class="t" font-size="40" font-weight="800" text-anchor="middle">Lungenödem</text>
  <circle cx="775" cy="540" r="120" fill="#F3F7FC" stroke="#2F3E58" stroke-width="5"/>
  <clipPath id="unten"><rect x="655" y="545" width="240" height="120"/></clipPath>
  <circle cx="775" cy="540" r="115" fill="url(#wasser)" clip-path="url(#unten)"/>
  <text x="775" y="400" class="klein" font-size="24" text-anchor="middle">Flüssigkeit in den Bläschen</text>
  <rect x="610" y="700" width="330" height="56" rx="28" fill="#C76B8A"/>
  <text x="775" y="800" class="klein" font-size="24" text-anchor="middle">Das Blut staut sich zurück –</text>
  <text x="775" y="832" class="klein" font-size="24" text-anchor="middle">vor dem linken Herzen</text>
  <text x="775" y="935" class="t" font-size="34" font-weight="800" text-anchor="middle" fill="#A9466A">Durchblutet, aber die</text>
  <text x="775" y="980" class="t" font-size="34" font-weight="800" text-anchor="middle" fill="#A9466A">Bläschen sind gefüllt</text>
  <text x="775" y="1050" class="klein" font-size="24" text-anchor="middle">z. B. bei Linksherzschwäche</text>
  <text x="775" y="1082" class="klein" font-size="24" text-anchor="middle">oder nach einem Herzinfarkt</text>

  <text x="90" y="1294" class="klein" font-size="24" font-weight="500">Schriftliche Heilpraktikerprüfung</text>
</svg>
