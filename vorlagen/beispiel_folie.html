<!doctype html>
<!-- Vorlage für eine Instagram-Folie (1080 × 1350). Frei veränderbar – nur Format und Regeln beachten (siehe ZUSAMMENARBEIT_INSTAGRAM.md). -->
<html lang="de"><head><meta charset="utf-8">
<style>
  :root { --blau1:#C5D9F2; --blau2:#E3EDF9; --navy:#2F3E58; --rose:#A9466A; --grau:#5D6473; }
  html,body { margin:0; width:1080px; height:1350px; overflow:hidden; }
  body { background:linear-gradient(180deg,var(--blau1),var(--blau2)); font-family:"Inter",sans-serif; color:var(--navy); position:relative; }
  .kopf { position:absolute; top:58px; left:90px; right:90px; display:flex; justify-content:space-between; align-items:center; font:700 30px "Liberation Serif",serif; }
  .seite { font:600 24px "Inter"; background:#fff; border-radius:99px; padding:6px 18px; }
  .inhalt { position:absolute; top:260px; left:90px; right:90px; }
  h1 { font:900 92px/1.04 "Inter Display","Inter",sans-serif; margin:0 0 30px; letter-spacing:-1.5px; }
  .fuss { position:absolute; bottom:56px; left:90px; font:500 24px "Inter"; color:var(--grau); }
</style></head><body>
  <div class="kopf"><span>Das wird gefragt.</span><span class="seite">1/1</span></div>
  <div class="inhalt"><h1>Überschrift</h1><p style="font-size:38px;line-height:1.35">Text</p></div>
  <div class="fuss">Schriftliche Heilpraktikerprüfung</div>
</body></html>
